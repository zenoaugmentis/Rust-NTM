name: Rust CI

on:
  push:
    branches: [main, engineering/D01-workspace]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - run: rustc --version
      - run: cargo build --locked
      - run: cargo test --locked